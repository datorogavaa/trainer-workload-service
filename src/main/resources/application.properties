server.port=8081
spring.application.name=trainer-workload-service

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Dedicated Base64 HS256 key shared only with the gym CRM main service.
security.jwt.secret_integration=${WORKLOAD_JWT_SECRET:Z3ltLWNybS13b3JrbG9hZC1zZWNyZXQta2V5LW1pbi0yNTYtYml0cy1sb25nLSEhIQ==}
security.jwt.expiration-ms=300000

management.endpoints.web.exposure.include=health,info

logging.pattern.level=%5p [txId=%X{transactionId:-none}]

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.jms.pub-sub-domain=false
management.health.jms.enabled=false

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/trainer_workload}
spring.data.mongodb.auto-index-creation=true