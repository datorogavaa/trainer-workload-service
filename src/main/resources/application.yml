server:
  port: 8081
spring:
  application:
    name: trainer-workload-service
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
security:
  jwt:
    # Base64 encoded, at least 256 bits. Must be identical in the main service. Override via env var in real deployments.
    secret: ${JWT_SECRET:Z3ltLWNybS13b3JrbG9hZC1zZWNyZXQta2V5LW1pbi0yNTYtYml0cy1sb25nLSEhIQ==}
    expiration-ms: 300000
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: "%5p [txId=%X{transactionId:-none}]"
